<div style="width: 1600px; height: 900px; box-sizing: border-box; padding: 64px; background: #FFFFFF; display: flex; flex-direction: column; gap: 48px; font-family: 'Bricolage Grotesque', sans-serif">

<div style="flex: 1; display: flex; flex-direction: column; gap: 10px">

<div style="flex: 1; display: flex; flex-direction: column; gap: 10px">

<script type="text/x-dc" data-dc-script data-props='{"blue":{"editor":"color","default":"#8FD3F4","options":["#8FD3F4","#7CC4EE","#A5DDF8"]},"lime":{"editor":"color","default":"#B5F23D","options":["#B5F23D","#A4E21A","#C6F76B"]},"$preview":{"width":1600,"height":900}}'>

return { blue: this.props.blue ?? '#8FD3F4', lime: this.props.lime ?? '#B5F23D' };
}
}
</script>
