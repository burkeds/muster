# nginx configuration for the Tiled web client container.
#
# Serving:
#   - static SPA (Vite build) with an /index.html fallback for client routing
#   - gzip
#   - a same-origin reverse proxy at /tiled/<host>/... that forwards to the
#     remote Tiled host, mirroring the Vite dev proxy so remote Tiled servers
#     can be reached from the browser without CORS. WebSocket upgrades are
#     forwarded so live /stream/ connections work too.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: let client-side routes fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Important static assets served with long caching; index.html is NOT cached.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Serve the generated config (assets/config are not cached, so this is fine).
    location = /config.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Reverse proxy for arbitrary remote Tiled hosts: /tiled/<host[:port]>/<rest>.
    # The host segment is restricted to valid [hostname[:port]] characters to
    # reduce SSRF surface. Because proxy_pass uses a variable, an nginx resolver
    # is required for DNS; upstream TLS SNI is set from the requested host.
    #
    # The resolver is filled in at container start from the TILED_PROXY_RESOLVER
    # env var (default: Docker's embedded DNS 127.0.0.11). Set it to a public or
    # your network's resolver when not running on a Docker bridge network.
    #
    # NOTE: for untrusted deployments, restrict which hosts may be proxied
    # (e.g. `location ~ ^/tiled/(allowed\.host\.example)(.*)$`) or rely on an
    # external access policy. TLS to hosts with self-signed certs may require:
    #   proxy_ssl_verify off;
    location ~ ^/tiled/([A-Za-z0-9._:\-\[\]]+)(.*)$ {
        resolver {{TILED_PROXY_RESOLVER}} valid=30s ipv6=off;
        set $tiled_host $1;
        set $tiled_rest $2;

        proxy_http_version 1.1;
        proxy_set_header Host $tiled_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Forward WebSocket upgrade (Tiled /api/v1/stream/...).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_ssl_server_name on;
        proxy_ssl_name $tiled_host;

        proxy_pass https://$tiled_host$tiled_rest;
        proxy_read_timeout 1h;
    }

    # Gzip text assets.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
